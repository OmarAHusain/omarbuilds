# Builds the site on every push and once a day (so new YouTube videos show up
# without a commit). Deploys to GitHub Pages. If you host on Netlify instead,
# keep the schedule and swap the deploy step for a Netlify build-hook curl
# (see README).
name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # to commit refreshed caches (videos / follower counts)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Commit refreshed caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/videos-cache.json content/stats-cache.json
          git diff --cached --quiet || git commit -m "chore: refresh feed + follower caches" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
